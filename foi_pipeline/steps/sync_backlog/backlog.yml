  first_seen: '2026-06-11T12:07:12.002939+00:00'
  last_seen: '2026-06-11T16:38:37.651897+00:00'
  investigation_notes: 'Investigated 2026-06-11. Four distinct root causes found:

    RC1 (FIXED): PART-GRAN (Limerick CC abbreviation) and Part (Dept Social Protection

    abbreviation) both map to Part-Granted; Queried (DCEDIY clarification-requested

    status) maps to Unknown. Added to lib/status_map.py synonyms.

    RC2 (upstream): Journalist (67) and Other (37) are requester_type column values

    leaking into decision_status due to column-shift in bodies 1135/1139/1012. Fix

    in transform/normalize steps. Also: _classify_unrecognized marks these as

    UnrecognizedDecisionStatus, not StatusValueIsRequesterType, because column_map.py

    does not cover requester_type VALUE synonyms (only column header synonyms).

    RC3 (upstream): Type (25), Cineál (24), D (27), Request (16), Made (20),

    Decision Made (21) are page-header rows leaking into data rows. Evidence: these

    records have ref=None, requester_type=None or contain other header values.

    Bodies 1135 (Fingal bilingual headers), 1016 (DSP abbreviated headers), 1018.

    Fix in normalize_disclosure_cells or extract_disclosures_normalize_rows — these

    header rows are not being filtered out before canonicalization.

    RC4 (minor): _classify_unrecognized should recognise Journalist/Other as

    StatusValueIsRequesterType. Currently it calls canonicalize_header() which only

    covers column header names, not the actual cell values used as requester types.

    '
  resolved_at: '2026-06-11T17:02:01.259690+00:00'
