- key: extract_disclosures_canonicalize:39_files_failed_with_insufficientcolumns
  step_name: extract_disclosures_canonicalize
  description: 39 files failed with InsufficientColumns (3.9%)
  severity: warning
  priority: high
  affected_count: 39
  suggestion_detail: null header columns prevent canonical mapping
  status: resolved
  first_seen: '2026-06-11T16:38:37.651897+00:00'
  last_seen: '2026-06-15T16:36:48.819885+00:00'
  resolved_at: '2026-06-16T13:03:40.776114+00:00'
  investigation_notes: "Investigated 2026-06-11. 39 failures split into 5 distinct\
    \ root causes;\nnot a single fix. Data from errors.json + normalize_header/output.json.\n\
    \nRC-A (~11 files, 0 cols mapped): GENUINELY NON-FOI DOCUMENTS — correct\nrejections,\
    \ wrong fix location. These slipped through verify_disclosure_files:\n- 4 calendar\
    \ PDFs (Minister_Morans_Calendar_Q1_2025.pdf, Q1_January_-_March.pdf,\n  Q2_April_-_June.pdf,\
    \ Q3_July_-_September.pdf, Q4_October_-_December.pdf) from\n  assets.gov.ie —\
    \ header rows are date ranges e.g. ['29 December 2025 -', 'January 2026']\n- 3\
    \ heritage visitor-number PDFs (heritage-services-visitor-numbers-2015/18/21.pdf)\n\
    \  — header = ['Site Name', '2015', '2016', '2017']\n- community-connect-calendar-2025.pdf\
    \ (Louth) — header = [None, 'National Hug Day', ...]\n- foi_faq2.pdf (Irish Prisons)\
    \ — header = ['Freedom of Information - Frequently Asked\n  Questions'] — FAQ\
    \ document, not a disclosure log\n- foi-004-24.pdf (fiosru.ie) — internal FOI\
    \ review/decision letter, header =\n  ['Page No', 'Description of Document', 'Deletions',\
    \ 'Relevant Sections of FOI Acts',\n  'Reason for Decision', \"Decision maker's\
    \ decision\"]\nFix: upstream in verify_disclosure_files — reject calendars, visitor\
    \ counts, FAQ docs,\nindividual decision letters. No fix needed in canonicalize.\n\
    \nRC-B (~9 files, 0 cols mapped): DATA ROW USED AS HEADER — detect_header_row\n\
    failed to find a header row, so header_row_idx points at a first data row.\n-\
    \ non-personal-foi-requests-june/july/august-2015.pdf (gov.ie) — header is e.g.\n\
    \  ['609', 'TJ McIntyre', 'Records from a meeting...'] — a data row, no column\
    \ headers\n- disclosure_log_april_to_end_of_june.pdf — header = ['28/03/2018',\
    \ 'FOI/2018/53', ...]\n- 2025 Freedom of Information Disclosure Log.pdf — header\
    \ = ['FOI-001', 'Journalist', ...]\n- disclosure-log-jan-to-dec-2025_redacted.pdf\
    \ (Limerick) — data row as header\n- Freedom_of_Information_Quarter_4_Requests_2025.pdf\
    \ — header = [None, '•', long request]\n- freedom-of-information-quarter-3-requests-2024.pdf\
    \ — header = ['FOI-2024-0123', ...]\n- Q2._FOI_Disclosure_Log_April_to_June_2025.pdf\
    \ (1f919c9b) — cells like\n  'FOI Reference Number FOI-0152-2025' (label+value\
    \ concatenated in one cell)\nFix: extract_disclosures_detect_header_row should\
    \ return header_row_idx=None when\nno recognizable column header row exists, so\
    \ canonicalize skips these cleanly.\n\nRC-C (4 files, 1 col mapped): SLIGO ETB\
    \ XLSX MALFORMED HEADER — files\ndisclosure-log-2021/2022/2023/2024.xlsx from\
    \ sligoetbservices. The detected\n\"header\" row contains cells like 'Date of\
    \ Decision 2024-01-31T00:00:00' repeated\n80+ times, plus 'Ref 24/FOI/01', 'Requester\
    \ Journalist', 'Decision Granted'.\ncanonicalize_header ISO-strips 'Date of Decision\
    \ 2024-01-31T00:00:00' →\n'date of decision' → decision_date (hence 1 col maps).\
    \ These are data rows, not\nheader rows — the XLSX appears to be transposed or\
    \ structured with no dedicated\nheader row. Fix: investigate in transform_disclosure_files\
    \ for this body; may need\nbody-specific column_swaps.json entry or a custom XLSX\
    \ reader path.\n\nRC-D (~9 files, 0-1 cols mapped): PDFPLUMBER MERGED ADJACENT\
    \ COLUMN HEADERS —\nadjacent column header cells concatenated into compound strings\
    \ that don't match\nany synonym:\n- Tipperary PDFs: 'Date ReceivedRequester Category',\
    \ 'Date decision issued Decision',\n  'Date decision Decision', 'FOI File No Date\
    \ ReceivedRequester Category'\n- Laois PDFs (Disclosure-log-Q2-2025.pdf, Disclosure-Log-Q3-2024.pdf):\n\
    \  header = [None, 'received Requestor', 'received Requestor', 'Decision Issued']\
    \ —\n  'Date received' + 'Requestor' merged across cells\n- Disclosure-Log-Q2-2022.pdf:\
    \ 'File Ref Date', 'Category of' + 'Application' (split)\nFix: either add compound\
    \ synonyms for the known patterns, or add splitting logic in\ncanonicalize_header\
    \ to recover e.g. 'date received' prefix from 'Date ReceivedRequester\nCategory'.\
    \ Lower priority — these are edge cases from specific body formats.\n\nRC-E (~7\
    \ files, 1 col mapped): MISSING SIMPLE SYNONYMS — clean header tokens\nnot yet\
    \ in lib/column_map.py. Quickest win:\n- 'number' → foi_reference_id: fixes 4\
    \ Meath PDFs\n  (headers = ['Number', 'Date of Receipt', 'Date of Receipt', ...])\n\
    - 'foi file no' → foi_reference_id: fixes Tipperary Apr-2021 + Feb-2019 PDFs\n\
    \  (headers include 'FOI File No' + 'Brief Description of Request' or 'Date Received')\n\
    - 'request outcome' → decision_status: fixes disclosure-log-q1-2026-non-personal.pdf\n\
