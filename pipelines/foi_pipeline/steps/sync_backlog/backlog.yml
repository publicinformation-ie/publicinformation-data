    \ would also help the q1-2026 file reach 3\nmapped columns but is lower confidence\
    \ (could mean date of postal response, not\ndecision date).\n\nSUMMARY BY PRIORITY:\n\
    - RC-E: fix lib/column_map.py (3 synonyms, ~7 files). Immediate, zero risk.\n\
