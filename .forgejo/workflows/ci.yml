name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: docker
    container:
      image: python:3.14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        run: pip install uv
      - name: Create environment
        run: uv venv --python 3.14
      - name: Install dependencies
        run: |
          uv pip install --python .venv/bin/python \
            -r pipelines/foi_pipeline/requirements.txt \
            -r pipelines/document_pipeline/requirements.txt \
            pyright
      - name: Check generated documentation
        run: uv run python scripts/generate_pipeline_docs.py --check
      - name: FOI pipeline tests
        run: uv run pytest pipelines/foi_pipeline/tests -q
      - name: Document pipeline tests
        run: uv run pytest pipelines/document_pipeline/tests -q
      - name: Root tests
        run: uv run pytest tests -q
      - name: Type check
        run: uv run pyright
