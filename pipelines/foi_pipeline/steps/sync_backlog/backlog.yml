    while decision_status=''Journalist''. _classify_unrecognized marks these as

    UnrecognizedDecisionStatus instead of StatusValueIsRequesterType because

    column_map.py covers column header synonyms, not the actual cell values used

    as requester type labels. Fix in transform/normalize steps (column alignment).

    RC3: D (27), Type (25), Cineál (24) are page-header rows leaking through as

    data rows. Evidence: ref=''of Request Number'', requester_type=''Category'' (body

    1135 bilingual headers); ref=None, requester_type=None or requester_type=''B''

    (body 1016 DSP abbreviated headers). Fix: filter header-pattern rows before

    extract_disclosures_canonicalize_rows, e.g. in normalize_disclosure_cells or

    extract_disclosures_normalize_rows.

    RC4: _classify_unrecognized should classify Journalist/Other as

    StatusValueIsRequesterType. Currently canonicalize_header() only covers column

    header names; add value-level requester_type synonyms to column_map.py so

    these get correctly labelled rather than lumped into UnrecognizedDecisionStatus.

    '
