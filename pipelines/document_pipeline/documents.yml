  # Progress reports: Taoiseach listing page. Their status detail is published in
  # companion spreadsheet annexes, so each declares `status_source: annex` and is
  # skipped by extract_action_status (it still bundles as a document). The listing
  # page carries no per-report date and most covers give only a month, so
  # published_date is the PDF creation date ONLY where it agrees with the month on
  # the cover; otherwise it is omitted rather than guessed.
  # Dates added 2026-11-10 from Department of the Taoiseach press releases
  # (gov.ie/en/department-of-the-taoiseach/press-releases/), each stating
  # "Published on": Q2 2023 -> 2023-07-25; CAP25 Q1 -> 2025-07-17; Q1&Q2 2026 legacy
