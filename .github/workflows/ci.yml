name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Create environment
        run: uv venv --python 3.14
      - name: Install dependencies
        run: |
          uv pip install --python .venv/bin/python \
            -r pipelines/foi_pipeline/requirements.txt \
            -r pipelines/document_pipeline/requirements.txt \
            -r scripts/requirements-build.txt \
            pyright
      - name: Build FOI combined forms
        run: uv run python scripts/build_foi_combined.py
      - name: Built forms must be ignored by git
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then echo "$status"; echo "Build left tracked or untracked changes"; exit 1; fi
      - name: Check generated documentation
        run: uv run python scripts/generate_pipeline_docs.py --check
      - name: FOI pipeline tests
        run: uv run pytest pipelines/foi_pipeline/tests -q
      - name: Document pipeline tests
        run: uv run pytest pipelines/document_pipeline/tests -q
      - name: Root tests
        run: uv run pytest tests -q
      - name: Type check
        run: uv run pyright
