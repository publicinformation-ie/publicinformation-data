  step_name: extract_disclosures_canonicalize_rows
  description: 763 records have non-canonical but recognized statuses (passthrough)
  severity: info
  priority: high
  affected_count: 763
  suggestion_detail: 'Consider adding to canonical mapping: ''PART-GRAN'' (36), ''Request''
    (23), ''Queried'' (22), ''Part'' (19), ''Made'' (16)'
